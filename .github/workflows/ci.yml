name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so newly published vulnerabilities in dependencies are caught without a code change.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mrs
          POSTGRES_USER: mrs
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mrs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest
      - name: Backup / restore cycle
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          python manage.py migrate --noinput
          python manage.py bootstrap_admin >/dev/null
          DB_EXEC="env PGHOST=localhost PGPASSWORD=ci-only-password" POSTGRES_DB=mrs POSTGRES_USER=mrs \
            ../deploy/scripts/test-backup-restore.sh
      - name: Off-site backup cycle (encrypted upload, offline retry, recovery with the phrase)
        run: |
          sudo apt-get install -y restic >/dev/null
          DB_EXEC="env PGHOST=localhost PGPASSWORD=ci-only-password" POSTGRES_DB=mrs POSTGRES_USER=mrs \
            API_EXEC="python $GITHUB_WORKSPACE/backend/manage.py" ../deploy/scripts/test-offsite-backup.sh
      - name: Audit log chain intact after the test cycles
        run: python manage.py verify_audit_chain --quiet

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the secret scan checks every commit in a push, so it needs their history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Known vulnerabilities in Python dependencies
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: Known vulnerabilities in frontend dependencies
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=moderate && npm audit --audit-level=high  # build and test tools too
      - name: Static security analysis (Python)
        run: pip install bandit && bandit -q -r backend/apps backend/config -x '*/tests/*,*/migrations/*' -ll
      - name: Shell scripts pass shellcheck
        run: shellcheck -S warning deploy/install.sh deploy/scripts/*.sh
      - name: Guided installer (fresh install, re-run, check-only, bad answers, trial mode)
        run: deploy/scripts/test-install.sh
      - name: No secrets committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mrs-api:ci backend
      - run: docker build -t mrs-web:ci frontend
      - name: Nginx configuration is valid (HTTP trial mode)
        run: |
          docker run --rm -e MRS_HTTPS=false --add-host api:127.0.0.1 mrs-web:ci \
            sh -c '/docker-entrypoint.d/40-select-mode.sh && nginx -t'
      - name: Container images have no fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0  # immutable release; older unprefixed tags were withdrawn after the March 2026 compromise
        with:
          image-ref: mrs-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
