# Clinic MRS — single-server deployment (Ubuntu Server 24.04 LTS).
# Only the `web` service is published to the clinic LAN. `api` and `db` sit on an
# internal network with no published ports.

name: mrs

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mrs}
      POSTGRES_USER: ${POSTGRES_USER:-mrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Africa/Addis_Ababa
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=1GB
        -c effective_cache_size=4GB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c max_connections=50
        -c log_min_duration_statement=1000
        -c log_line_prefix='%m [%p] %u@%d '
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    build: ./backend
    image: mrs-api:${MRS_VERSION:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # The System page reads backup dates and sizes from here (read-only; it never restores).
      BACKUP_DIR: /var/backups/mrs
      MRS_VERSION: ${MRS_VERSION:-}
      PAYMENTS_EGRESS_PROXY: http://egress:3128
    volumes:
      - ${BACKUP_DIR:-/var/backups/mrs}:/var/backups/mrs:ro
    # The application cannot change its own code or gain privileges, even if a bug is exploited.
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [internal]
    logging: *logging

  # Payments by phone only: lets the API reach the payment providers' hosts and nothing else
  # (backend/egress_relay.py). TLS is end to end; the relay sees no payment data.
  egress:
    image: mrs-api:${MRS_VERSION:-local}
    restart: unless-stopped
    command: ["python", "egress_relay.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-api.chapa.co}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 64m
    networks: [internal, outbound]
    logging: *logging

  web:
    build: ./frontend
    image: mrs-web:${MRS_VERSION:-local}
    restart: unless-stopped
    environment:
      MRS_HTTPS: ${MRS_HTTPS:-true}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # nginx needs only these: bind ports 80/443 and switch to its unprivileged worker user.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [internal, lan]
    logging: *logging

networks:
  internal:
    internal: true   # no route to the outside world
  lan: {}
  outbound: {}   # only the egress relay joins this one

volumes:
  pgdata:
